<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card">
    <div class="banner" aria-hidden="true"></div>
    <div class="body">
      <div class="avatar" aria-hidden="true">S</div>

      <h1>anubhav</h1>
      <p class="role">Frontend developer</p>
      <p class="place">Sambalpur, Odisha</p>

      <p class="bio">
        BSc Computer Science student who builds clean, responsive web pages
        and is learning JavaScript, Docker and open-source workflows.
      </p>

      <div class="stats">
        <div><strong>Sem III</strong>BSc CS</div>
        <div><strong>2028</strong>Graduating</div>
      </div>

      <h2>Skills</h2>
      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Git</li>
        <li class="learning">Docker (learning)</li>
      </ul>

      <div class="actions">
        <a class="btn primary" href="https://github.com/SwatiManjari">GitHub</a>
        <a class="btn ghost" href="mailto:you@example.com">Email me</a>
      </div>
    </div>
  </article>
</body>
</html>
